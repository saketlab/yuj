[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuj"
dynamic = ["version"]
description = "A polite, daemon-less batch distributor for opportunistic SSH targets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saket Choudhary", email = "saketc@iitb.ac.in" }]
keywords = [
    "ssh",
    "batch",
    "distributed",
    "cycle-scavenging",
    "rsync",
    "cron",
    "hpc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Clustering",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
paramiko = ["paramiko>=3.4"]
docs = [
    "sphinx>=7.3",
    "furo>=2024.5",
    "myst-parser>=3.0",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=0.9",
]

[project.urls]
Homepage = "https://github.com/saketlab/yuj"
Repository = "https://github.com/saketlab/yuj"
Issues = "https://github.com/saketlab/yuj/issues"
Changelog = "https://github.com/saketlab/yuj/blob/main/CHANGELOG.md"

[project.scripts]
yuj = "yuj.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
    "shellcheck-py>=0.10",
]

[tool.hatch.version]
path = "src/yuj/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yuj"]
# Ship the Jinja2 templates and bootstrap recipes (non-.py data) in the wheel.
artifacts = ["src/yuj/templates/*.j2", "src/yuj/bootstrap_recipes/*.sh"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# asserts, hardcoded test creds, /tmp paths, subprocess (shellcheck) in tests
"tests/**" = ["S101", "S105", "S106", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["yuj"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that SSH into real hosts (opt-in; deselect with -m 'not e2e')",
]
